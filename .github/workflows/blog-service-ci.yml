name: blog-service CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'platform-services/blog-service/**'
      - '.github/workflows/blog-service-ci.yml'
  pull_request:
    paths:
      - 'platform-services/blog-service/**'
      - '.github/workflows/blog-service-ci.yml'

defaults:
  run:
    working-directory: platform-services/blog-service

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    # No real Postgres/Kafka needed — the current test suite (auth
    # middleware, slug generation, HTML sanitization) is pure-function
    # unit tests, same posture as the other Node service workflows.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test
