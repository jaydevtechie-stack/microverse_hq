name: email-service CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'platform-services/email-service/**'
      - '.github/workflows/email-service-ci.yml'
  pull_request:
    paths:
      - 'platform-services/email-service/**'
      - '.github/workflows/email-service-ci.yml'

defaults:
  run:
    working-directory: platform-services/email-service

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    # No real MailHog/SMTP needed — the current test suite only covers
    # renderTemplate, a pure file-read-and-substitute function.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test
