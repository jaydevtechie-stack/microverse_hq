name: taskfusion CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'applications/taskfusion/**'
      - '.github/workflows/taskfusion-ci.yml'
  pull_request:
    paths:
      - 'applications/taskfusion/**'
      - '.github/workflows/taskfusion-ci.yml'

defaults:
  run:
    working-directory: applications/taskfusion

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # CI=true makes react-scripts run once and exit instead of
      # watch-mode (its default, meant for local dev).
      - run: npm test
        env:
          CI: true
