<h2 class="sr-only">Finalized navigation: a PM-facing Projects hub with its own Projects and Accounts subnav, separate from an Admin section with its own Users and Services subnav, both feeding the same split-view content area</h2>

<div style="background:#05061A;border-radius:16px;padding:0;overflow:hidden;max-width:640px;margin:0 auto">

<div style="padding:14px 16px;border-bottom:0.5px solid #1E2A6B;display:flex;align-items:center;justify-content:space-between">
  <div style="display:flex;align-items:center;gap:18px">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:8px;height:8px;border-radius:50%;background:#4DD8FF"></div>
      <span style="color:#E8F4FF;font-weight:500;font-size:14px">Microverse</span>
    </div>
    <span style="color:#9BB8E0;font-size:13px">Dashboard</span>
    <span style="color:#9BB8E0;font-size:13px">Reports</span>
    <span id="section-projects" onclick="setSection('projects')" style="font-size:13px;cursor:pointer;padding-bottom:2px">Projects</span>
    <span id="section-admin" onclick="setSection('admin')" style="font-size:13px;cursor:pointer;padding-bottom:2px">Admin</span>
  </div>
  <div style="width:26px;height:26px;border-radius:50%;background:#2D5FDB;display:flex;align-items:center;justify-content:center;color:#E8F4FF;font-size:11px;font-weight:500">A</div>
</div>

<div style="padding:10px 16px;border-bottom:0.5px solid #1E2A6B;display:flex;gap:18px" id="subnav"></div>

<div style="display:flex;justify-content:flex-end;gap:6px;padding:10px 16px 0">
  <button id="mode-desktop" onclick="setMode('desktop')" style="padding:4px 10px;font-size:11px">Desktop</button>
  <button id="mode-mobile" onclick="setMode('mobile')" style="padding:4px 10px;font-size:11px">Mobile</button>
</div>

<div id="demo-shell" style="display:flex;height:400px;margin:10px 16px 16px">
  <div id="list-panel" style="width:100%;flex:none;transition:width 0.15s ease;overflow:hidden;border:0.5px solid #1E2A6B;border-radius:12px 0 0 12px;border-right:none">
    <div id="list-body"></div>
  </div>
  <div id="resizer" style="width:0;flex-shrink:0;cursor:col-resize;position:relative;transition:width 0.15s ease">
    <div style="position:absolute;left:-3px;top:0;bottom:0;width:7px"></div>
  </div>
  <div id="detail-panel" style="flex:0 0 0px;overflow:hidden;transition:flex-basis 0.15s ease;border:0.5px solid #1E2A6B;border-radius:0 12px 12px 0">
    <div id="detail-body" style="padding:20px;width:100%;box-sizing:border-box"></div>
  </div>
</div>
</div>

<script>
let mode = 'desktop';
let panel = 'list';
let splitRatio = 41.6667;
let section = 'projects';
let activeTab = 'projects';

const sections = {
  projects: [{ id:'projects', label:'Projects' }, { id:'accounts', label:'Accounts' }],
  admin: [{ id:'users', label:'Users' }, { id:'services', label:'Services' }]
};

const data = {
  users: { label:'Users · admin', items:{
      jane:{title:'Jane Doe', sub:'jane@acme.dev', dot:'#639922'},
      mark:{title:'Mark Rees', sub:'mark@acme.dev', dot:'#5F5E5A'} },
    detail:{ jane:{name:'Jane Doe', email:'jane@acme.dev', active:true, roles:['platform:analyst','platform:reviewer','service:gofeeler']},
      mark:{name:'Mark Rees', email:'mark@acme.dev', active:false, roles:['platform:analyst','service:pyreel']} } },
  services: { label:'Services · admin', items:{
      gofeeler:{title:'Gofeeler', sub:'online · v1.2.0', dot:'#639922'},
      djaboard:{title:'Djaboard', sub:'building · v0.1.0', dot:'#EF9F27'} },
    detail:{ gofeeler:{name:'Gofeeler', status:'online', version:'v1.2.0', actions:['Deactivate service','Edit card details']},
      djaboard:{name:'Djaboard', status:'building', version:'v0.1.0', actions:['Activate service','Edit card details']} } },
  projects: { label:'Projects · PM', items:{
      acme:{title:'Q3 Sentiment Monitoring', sub:'Acme Forestry', dot:'#639922'},
      boreal:{title:'Support Sentiment Pilot', sub:'Boreal Co', dot:'#EF9F27'} },
    detail:{ acme:{name:'Q3 Sentiment Monitoring', account:'Acme Forestry', owner:'Priya (PM)', terms:'Net-30',
        tasks:[{id:'#1024',title:'Q3 customer support chat review',color:'#4DD8FF'},{id:'#1026',title:'Escalation thread review',color:'#E24B4A'}]},
      boreal:{name:'Support Sentiment Pilot', account:'Boreal Co', owner:'Jane Doe (senior analyst)', terms:'Upfront',
        tasks:[{id:'#1025',title:'Support ticket sentiment scan',color:'#EF9F27'}]} } },
  accounts: { label:'Accounts · PM', items:{
      acme:{title:'Acme Forestry', sub:'Company · 3 contacts', dot:'#4DD8FF'},
      boreal:{title:'Boreal Co', sub:'Company · 1 contact', dot:'#9BB8E0'} },
    detail:{ acme:{name:'Acme Forestry', type:'Company · 3 contacts', pms:['Priya'], projects:[{name:'Q3 Sentiment Monitoring', terms:'Net-30'}]},
      boreal:{name:'Boreal Co', type:'Company · 1 contact', pms:['Mark'], projects:[{name:'Support Sentiment Pilot', terms:'Upfront'}]} } }
};

function renderSubnav() {
  const nav = document.getElementById('subnav');
  nav.innerHTML = sections[section].map(t =>
    `<span id="tab-${t.id}" onclick="setTab('${t.id}')" style="font-size:12px;cursor:pointer;padding-bottom:4px">${t.label}</span>`).join('');
}

function renderList() {
  const listBody = document.getElementById('list-body');
  const d = data[activeTab];
  listBody.innerHTML = `<div style="padding:14px 16px;border-bottom:0.5px solid #1E2A6B"><span style="color:#E8F4FF;font-size:13px;font-weight:500">${d.label}</span></div>` +
    Object.entries(d.items).map(([id, it]) => `
      <div onclick="openDetail('${id}')" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:0.5px solid #1E2A6B;cursor:pointer">
        <div style="width:7px;height:7px;border-radius:50%;background:${it.dot};flex-shrink:0"></div>
        <div style="min-width:0"><div style="color:#E8F4FF;font-size:13px;white-space:nowrap">${it.title}</div><div style="color:#5F5E5A;font-size:11px;white-space:nowrap">${it.sub}</div></div>
      </div>`).join('');
}

function renderDetail(id) {
  const body = document.getElementById('detail-body');
  const back = `<span onclick="closePanel()" style="color:#4DD8FF;font-size:12px;cursor:pointer">← Back</span>`;
  if (activeTab === 'users') {
    const u = data.users.detail[id];
    body.innerHTML = back + `<div style="display:flex;align-items:center;gap:12px;margin:14px 0 16px">
        <div style="width:40px;height:40px;border-radius:50%;background:${u.active?'#2D5FDB':'#3A3A3A'};display:flex;align-items:center;justify-content:center;color:#E8F4FF;font-size:14px;font-weight:500">${u.name.split(' ').map(n=>n[0]).join('')}</div>
        <div><p style="color:#E8F4FF;font-size:15px;font-weight:500;margin:0">${u.name}</p><p style="color:#9BB8E0;font-size:12px;margin:2px 0 0">${u.email}</p></div>
        <span style="margin-left:auto;font-size:11px;padding:2px 10px;border-radius:10px;background:${u.active?'#63992222':'#5F5E5A22'};color:${u.active?'#639922':'#9BB8E0'}">${u.active?'active':'deactivated'}</span></div>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 8px">Roles</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">${u.roles.map(r=>`<span style="padding:4px 10px;font-size:11px;border-radius:12px;background:#4DD8FF22;color:#4DD8FF">${r}</span>`).join('')}</div>
      <button style="width:100%;padding:10px 0;background:transparent;border:0.5px solid ${u.active?'#E24B4A':'#639922'};color:${u.active?'#E24B4A':'#639922'};font-weight:500;font-size:13px;border-radius:8px">${u.active?'Deactivate user':'Reactivate user'}</button>`;
  } else if (activeTab === 'services') {
    const s = data.services.detail[id];
    body.innerHTML = back + `<p style="color:#E8F4FF;font-size:15px;font-weight:500;margin:14px 0 4px">${s.name}</p>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 18px">${s.status} · ${s.version}</p>
      <div style="display:flex;flex-direction:column;gap:8px">${s.actions.map(a=>`<button style="padding:9px 0;background:#0B0F2E;border:0.5px solid #1E2A6B;color:#E8F4FF;font-size:12px;border-radius:8px">${a}</button>`).join('')}</div>`;
  } else if (activeTab === 'projects') {
    const p = data.projects.detail[id];
    body.innerHTML = back + `<p style="color:#E8F4FF;font-size:15px;font-weight:500;margin:14px 0 4px">${p.name}</p>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 18px">Account: <span style="color:#4DD8FF;cursor:pointer">${p.account}</span></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
        <div style="background:#0B0F2E;border:0.5px solid #1E2A6B;border-radius:8px;padding:10px 12px"><p style="color:#5F5E5A;font-size:11px;margin:0 0 4px">Responsible user</p><p style="color:#E8F4FF;font-size:13px;margin:0">${p.owner}</p></div>
        <div style="background:#0B0F2E;border:0.5px solid #1E2A6B;border-radius:8px;padding:10px 12px"><p style="color:#5F5E5A;font-size:11px;margin:0 0 4px">Payment terms</p><p style="color:#E8F4FF;font-size:13px;margin:0">${p.terms}</p></div>
      </div>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 8px">Orders / Tasks</p>
      ${p.tasks.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:0.5px solid #1E2A6B"><div style="width:7px;height:7px;border-radius:50%;background:${t.color};flex-shrink:0"></div><span style="color:#E8F4FF;font-size:12px">${t.id} · ${t.title}</span></div>`).join('')}`;
  } else if (activeTab === 'accounts') {
    const a = data.accounts.detail[id];
    body.innerHTML = back + `<div style="display:flex;align-items:center;gap:12px;margin:14px 0 18px">
        <div style="width:40px;height:40px;border-radius:10px;background:#2D5FDB;display:flex;align-items:center;justify-content:center"><i class="ti ti-building" style="color:#E8F4FF;font-size:18px" aria-hidden="true"></i></div>
        <div><p style="color:#E8F4FF;font-size:15px;font-weight:500;margin:0">${a.name}</p><p style="color:#9BB8E0;font-size:12px;margin:2px 0 0">${a.type}</p></div></div>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 8px">Assigned PMs</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px">${a.pms.map(p=>`<span style="padding:4px 10px;font-size:11px;border-radius:12px;background:#4DD8FF22;color:#4DD8FF">${p}</span>`).join('')}</div>
      <p style="color:#9BB8E0;font-size:12px;margin:0 0 8px">Projects</p>
      ${a.projects.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:0.5px solid #1E2A6B"><span style="color:#E8F4FF;font-size:12px;flex:1">${p.name}</span><span style="color:#9BB8E0;font-size:11px">${p.terms}</span></div>`).join('')}`;
  }
}

function openDetail(id) { renderDetail(id); panel = 'detail'; render(); }

function setSection(s) {
  section = s;
  activeTab = sections[s][0].id;
  panel = 'list';
  document.getElementById('section-projects').style.color = s==='projects' ? '#4DD8FF' : '#9BB8E0';
  document.getElementById('section-projects').style.borderBottom = s==='projects' ? '2px solid #4DD8FF' : 'none';
  document.getElementById('section-admin').style.color = s==='admin' ? '#4DD8FF' : '#9BB8E0';
  document.getElementById('section-admin').style.borderBottom = s==='admin' ? '2px solid #4DD8FF' : 'none';
  renderSubnav();
  setTab(activeTab);
}

function setTab(t) {
  activeTab = t;
  panel = 'list';
  document.querySelectorAll('[id^="tab-"]').forEach(el => { el.style.color = '#9BB8E0'; el.style.borderBottom = 'none'; });
  const el = document.getElementById('tab-' + t);
  if (el) { el.style.color = '#4DD8FF'; el.style.borderBottom = '2px solid #4DD8FF'; }
  renderList();
  render();
}

function updateModeButtons() {
  document.getElementById('mode-desktop').style.background = mode==='desktop' ? '#0B0F2E' : 'transparent';
  document.getElementById('mode-desktop').style.color = mode==='desktop' ? '#E8F4FF' : '#9BB8E0';
  document.getElementById('mode-mobile').style.background = mode==='mobile' ? '#0B0F2E' : 'transparent';
  document.getElementById('mode-mobile').style.color = mode==='mobile' ? '#E8F4FF' : '#9BB8E0';
}
function render() {
  const list = document.getElementById('list-panel');
  const resizer = document.getElementById('resizer');
  const detail = document.getElementById('detail-panel');
  const splitOpen = panel !== 'list' && mode === 'desktop';
  resizer.style.width = splitOpen ? '6px' : '0';
  resizer.style.background = splitOpen ? '#1E2A6B' : 'transparent';
  if (mode === 'desktop') {
    list.style.width = panel === 'list' ? '100%' : splitRatio + '%';
    detail.style.flex = panel === 'detail' ? `0 0 ${100 - splitRatio}%` : '0 0 0px';
  } else {
    list.style.width = panel === 'list' ? '100%' : '0';
    detail.style.flex = panel === 'detail' ? '0 0 100%' : '0 0 0px';
  }
  updateModeButtons();
}
function setMode(m) { mode = m; render(); }
function closePanel() { panel = 'list'; render(); }

const resizerEl = document.getElementById('resizer');
resizerEl.addEventListener('mousedown', (e) => {
  if (panel === 'list' || mode === 'mobile') return;
  e.preventDefault();
  const shellRect = document.getElementById('demo-shell').getBoundingClientRect();
  const startX = e.clientX;
  const startRatio = splitRatio;
  function onMove(ev) {
    const deltaPct = ((ev.clientX - startX) / shellRect.width) * 100;
    splitRatio = Math.max(20, Math.min(60, startRatio + deltaPct));
    render();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

setSection('projects');
</script>
