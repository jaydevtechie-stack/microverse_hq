services:

  microverse-nginx:
    profiles: ["gofeeler"]
    build:
      context: ./infrastructure/nginx
    container_name: microverse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/secrets:/etc/nginx/certs:ro
    depends_on:
      microverse-keycloak:
        condition: service_healthy
      microverse-taskfusion:
        condition: service_started
    networks:
      - microverse-network


  microverse-keycloak:
    profiles: ["gofeeler"]
    build:
      # repo root, not ./infrastructure/keycloak — the build needs to
      # reach branding/mv-1.0 (see Dockerfile)
      context: .
      dockerfile: infrastructure/keycloak/Dockerfile
      args:
        KEYCLOAK_BRAND_THEME: ${MICROVERSE_BRAND_THEME}
    container_name: microverse-keycloak

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: sso.microverse.local
      KC_HEALTH_ENABLED: "true"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm-export:/opt/keycloak/data/import

    healthcheck:
      # the keycloak image has no curl/wget; use bash's /dev/tcp instead
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    networks:
      - microverse-network


  microverse-taskfusion:
    profiles: ["gofeeler"]
    build:
      # repo root, not ./applications/taskfusion — the build needs to
      # reach branding/mv-1.0 (see Dockerfile)
      context: .
      dockerfile: applications/taskfusion/Dockerfile
      args:
        REACT_APP_KEYCLOAK_URL: ${TASKFUSION_KEYCLOAK_URL}
        REACT_APP_KEYCLOAK_REALM: ${TASKFUSION_KEYCLOAK_REALM}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${TASKFUSION_KEYCLOAK_CLIENT_ID}
        REACT_APP_BRAND_THEME: ${MICROVERSE_BRAND_THEME}
    container_name: microverse-taskfusion
    depends_on:
      microverse-keycloak:
        condition: service_healthy
    networks:
      - microverse-network


  microverse-postgis:
    profiles: ["gofeeler"]
    image: postgis/postgis:latest
    container_name: microverse-postgis

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # only runs on a brand-new (empty) postgres_data volume — see
      # infrastructure/postgis/init/ for what's in here and why
      - ./infrastructure/postgis/init:/docker-entrypoint-initdb.d:ro

    networks:
      - microverse-network


  microverse-mongodb:
    # GoFeeler's home: raw uploaded content (chat/email/comment exports)
    # varies too much in shape for relational columns, and the sentiment
    # result is just metadata riding alongside it — Mongo's sweet spot.
    # task-service/rustledger/order-service stay on Postgres on purpose
    # (row locking, ACID, relational joins).
    profiles: ["gofeeler", "mongodb"]
    image: mongo:latest
    container_name: microverse-mongodb

    volumes:
      - mongodb_data:/data/db

    networks:
      - microverse-network


  microverse-redis:
    profiles: ["redis"]
    image: redis:latest
    container_name: microverse-redis

    networks:
      - microverse-network



  microverse-rabbitmq:
    profiles: ["rabbitmq"]
    image: rabbitmq:management
    container_name: microverse-rabbitmq

    networks:
      - microverse-network



  microverse-kafka:
    profiles: ["gofeeler", "kafka"]
    image: apache/kafka:latest
    container_name: microverse-kafka

    environment:
      # single-node KRaft mode — no Zookeeper needed
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://microverse-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@microverse-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - microverse-network



  microverse-elasticsearch:
    profiles: ["gofeeler", "elasticsearch"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: microverse-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

    networks:
      - microverse-network


  microverse-search-service:
    profiles: ["gofeeler", "search-service"]
    build:
      context: ./platform-services/search-service
    container_name: microverse-search-service
    environment:
      PORT: 8000
      ELASTICSEARCH_URL: http://microverse-elasticsearch:9200
      # Lifecycle-aware indexing consumer (6.2) — task-service.tasks topic
      KAFKA_BROKERS: microverse-kafka:9092
    depends_on:
      microverse-elasticsearch:
        condition: service_healthy
      microverse-kafka:
        condition: service_started
    networks:
      - microverse-network



  microverse-minio:
    profiles: ["gofeeler"]
    image: minio/minio
    container_name: microverse-minio

    command:
      - server
      - /data

    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

    volumes:
      - minio_data:/data

    networks:
      - microverse-network


  microverse-asset-service:
    profiles: ["gofeeler", "asset-service"]
    build:
      context: ./platform-services/asset-service
    container_name: microverse-asset-service
    environment:
      PORT: 8080
      # Public-facing, not the internal container hostname — presigned
      # URLs are handed to the browser, which can't resolve
      # microverse-minio. Its own dedicated subdomain (nginx proxies
      # storage.microverse.local straight to MinIO), not a path prefix
      # on microverse.local — SigV4 presigned URLs don't survive a
      # stripped path prefix, the AWS SDK's canonical-request signing
      # doesn't account for it.
      S3_ENDPOINT: https://storage.microverse.local
      # Real connectivity for list/head/create-bucket calls — the
      # public hostname above only resolves on the host machine, not
      # inside this container. Presigning doesn't need this (it's a
      # local signature computation, no actual request sent).
      S3_INTERNAL_ENDPOINT: http://microverse-minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      ASSETS_BUCKET_NAME: ${ASSETS_BUCKET_NAME}
      TASK_SERVICE_URL: http://microverse-task-service:3000
    depends_on:
      - microverse-minio
      - microverse-task-service
    networks:
      - microverse-network



  microverse-gofeeler:
    profiles: ["gofeeler"]
    build:
      context: ./domain-services/gofeeler
    container_name: microverse-gofeeler
    environment:
      # sentiment_results persistence (Branch 5) — best-effort, only
      # written when a request carries a taskId.
      MONGO_URL: mongodb://microverse-mongodb:27017/gofeeler
      # sentiment_prompt_templates (Branch 5)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@microverse-postgis:5432/${POSTGRES_DB}
      # Advanced engine's LLM provider — advanced engine stays disabled
      # (basic-only) if this is unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOFEELER_LLM_MODEL: ${GOFEELER_LLM_MODEL}
      # 5.8: pulling uploaded file content into /analyze — internal
      # container-to-container URL, not the public storage.microverse.local
      # host (see asset-service's own S3_ENDPOINT comment above for why).
      ASSET_SERVICE_URL: http://microverse-asset-service:8080
    depends_on:
      - microverse-mongodb
      - microverse-postgis
      - microverse-asset-service
    networks:
      - microverse-network


  microverse-netcruncher:
    profiles: ["netcruncher"]
    build:
      context: ./domain-services/netcruncher
    container_name: microverse-netcruncher
    networks:
      - microverse-network


  microverse-pyreel:
    profiles: ["pyreel"]
    build:
      context: ./domain-services/pyreel
    container_name: microverse-pyreel
    environment:
      RABBITMQ_HOST: microverse-rabbitmq
    depends_on:
      - microverse-rabbitmq
    networks:
      - microverse-network


  microverse-springpix:
    profiles: ["springpix"]
    build:
      context: ./domain-services/springpix
    container_name: microverse-springpix
    environment:
      # points the AWS S3 SDK at MinIO instead of real AWS — no AWS account
      # needed. Swap these for real AWS creds and drop S3_ENDPOINT to go live.
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: http://microverse-minio:9000
    depends_on:
      - microverse-minio
    networks:
      - microverse-network


  microverse-elixtempo:
    profiles: ["elixtempo"]
    build:
      context: ./domain-services/elixtempo
    container_name: microverse-elixtempo
    environment:
      PHX_SERVER: "true"
      PORT: 4000
      PHX_HOST: localhost
      SECRET_KEY_BASE: ${ELIXTEMPO_SECRET_KEY_BASE}
      KAFKA_BROKERS: microverse-kafka:9092
    depends_on:
      - microverse-kafka
    networks:
      - microverse-network


  microverse-rustledger:
    profiles: ["rustledger"]
    build:
      context: ./domain-services/rustledger
    container_name: microverse-rustledger
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@microverse-postgis:5432/${POSTGRES_DB}
      KAFKA_BROKERS: microverse-kafka:9092
      DEFAULT_HOURLY_RATE_CENTS: ${RUSTLEDGER_HOURLY_RATE_CENTS}
      DEFAULT_CURRENCY: ${RUSTLEDGER_CURRENCY}
    depends_on:
      - microverse-postgis
      - microverse-kafka
    networks:
      - microverse-network


  microverse-mailhog:
    profiles: ["mailhog"]
    image: mailhog/mailhog:latest
    container_name: microverse-mailhog
    networks:
      - microverse-network


  microverse-email-service:
    profiles: ["email-service"]
    build:
      context: ./platform-services/email-service
    container_name: microverse-email-service
    environment:
      PORT: 3000
      MAILHOG_SMTP_SERVER: microverse-mailhog:1025
    depends_on:
      - microverse-mailhog
    networks:
      - microverse-network


  microverse-notification-service:
    profiles: ["notification-service"]
    build:
      context: ./platform-services/notification-service
    container_name: microverse-notification-service
    networks:
      - microverse-network


  microverse-task-service:
    profiles: ["gofeeler"]
    build:
      context: ./business-services/task-service
    container_name: microverse-task-service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@microverse-postgis:5432/${POSTGRES_DB}
      # Lifecycle-aware indexing consumer (6.2) — publishes to
      # task-service.tasks, consumed by search-service
      KAFKA_BROKERS: microverse-kafka:9092
    depends_on:
      - microverse-postgis
      - microverse-kafka
    networks:
      - microverse-network



volumes:

  keycloak_data:
  postgres_data:
  mongodb_data:
  minio_data:
  kafka_data:
  elasticsearch_data:



networks:

  microverse-network:
    driver: bridge
