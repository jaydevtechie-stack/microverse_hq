services:

  microverse-nginx:
    build:
      context: ./infrastructure/nginx
    container_name: microverse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/secrets:/etc/nginx/certs:ro
    depends_on:
      microverse-keycloak:
        condition: service_healthy
      microverse-taskfusion:
        condition: service_started
    networks:
      - microverse-network


  microverse-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: microverse-keycloak

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: sso.microverse.local
      KC_HEALTH_ENABLED: "true"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm-export:/opt/keycloak/data/import
      - ./infrastructure/keycloak/themes/microverse:/opt/keycloak/themes/microverse:ro

    healthcheck:
      # the keycloak image has no curl/wget; use bash's /dev/tcp instead
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    networks:
      - microverse-network


  microverse-taskfusion:
    build:
      context: ./applications/taskfusion
      args:
        REACT_APP_KEYCLOAK_URL: ${TASKFUSION_KEYCLOAK_URL}
        REACT_APP_KEYCLOAK_REALM: ${TASKFUSION_KEYCLOAK_REALM}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${TASKFUSION_KEYCLOAK_CLIENT_ID}
    container_name: microverse-taskfusion
    depends_on:
      microverse-keycloak:
        condition: service_healthy
    networks:
      - microverse-network


  microverse-postgis:
    image: postgis/postgis:latest
    container_name: microverse-postgis

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - microverse-network


  microverse-mongodb:
    image: mongo:latest
    container_name: microverse-mongodb

    volumes:
      - mongodb_data:/data/db

    networks:
      - microverse-network


  microverse-redis:
    image: redis:latest
    container_name: microverse-redis

    networks:
      - microverse-network



  microverse-rabbitmq:
    image: rabbitmq:management
    container_name: microverse-rabbitmq

    networks:
      - microverse-network



  microverse-kafka:
    image: apache/kafka:latest
    container_name: microverse-kafka

    environment:
      # single-node KRaft mode — no Zookeeper needed
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://microverse-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@microverse-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - microverse-network



  microverse-minio:
    image: minio/minio
    container_name: microverse-minio

    command:
      - server
      - /data

    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

    volumes:
      - minio_data:/data

    networks:
      - microverse-network



  microverse-gofeeler:
    build:
      context: ./domain-services/gofeeler
    container_name: microverse-gofeeler
    networks:
      - microverse-network


  microverse-netcruncher:
    build:
      context: ./domain-services/netcruncher
    container_name: microverse-netcruncher
    networks:
      - microverse-network


  microverse-pyreel:
    build:
      context: ./domain-services/pyreel
    container_name: microverse-pyreel
    environment:
      RABBITMQ_HOST: microverse-rabbitmq
    depends_on:
      - microverse-rabbitmq
    networks:
      - microverse-network


  microverse-springpix:
    build:
      context: ./domain-services/springpix
    container_name: microverse-springpix
    environment:
      # points the AWS S3 SDK at MinIO instead of real AWS — no AWS account
      # needed. Swap these for real AWS creds and drop S3_ENDPOINT to go live.
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: http://microverse-minio:9000
    depends_on:
      - microverse-minio
    networks:
      - microverse-network


  microverse-elixtempo:
    build:
      context: ./domain-services/elixtempo
    container_name: microverse-elixtempo
    environment:
      PHX_SERVER: "true"
      PORT: 4000
      PHX_HOST: localhost
      SECRET_KEY_BASE: ${ELIXTEMPO_SECRET_KEY_BASE}
      KAFKA_BROKERS: microverse-kafka:9092
    depends_on:
      - microverse-kafka
    networks:
      - microverse-network


  microverse-rustledger:
    build:
      context: ./domain-services/rustledger
    container_name: microverse-rustledger
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@microverse-postgis:5432/${POSTGRES_DB}
      KAFKA_BROKERS: microverse-kafka:9092
      DEFAULT_HOURLY_RATE_CENTS: ${RUSTLEDGER_HOURLY_RATE_CENTS}
      DEFAULT_CURRENCY: ${RUSTLEDGER_CURRENCY}
    depends_on:
      - microverse-postgis
      - microverse-kafka
    networks:
      - microverse-network


  microverse-mailhog:
    image: mailhog/mailhog:latest
    container_name: microverse-mailhog
    networks:
      - microverse-network


  microverse-email-service:
    build:
      context: ./platform-services/email-service
    container_name: microverse-email-service
    environment:
      PORT: 3000
      MAILHOG_SMTP_SERVER: microverse-mailhog:1025
    depends_on:
      - microverse-mailhog
    networks:
      - microverse-network


  microverse-notification-service:
    build:
      context: ./platform-services/notification-service
    container_name: microverse-notification-service
    networks:
      - microverse-network


  microverse-task-service:
    build:
      context: ./platform-services/task-service
    container_name: microverse-task-service
    environment:
      MONGO_URL: mongodb://microverse-mongodb:27017/taskDB
    depends_on:
      - microverse-mongodb
    networks:
      - microverse-network



volumes:

  keycloak_data:
  postgres_data:
  mongodb_data:
  minio_data:
  kafka_data:



networks:

  microverse-network:
    driver: bridge
