<svg width="680" height="350" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Account, Project, and Order/Task relationships</title>
<desc>An Account contains Customers and Project Managers, and has many Projects. Project Managers are responsible for Projects. Each Project has one responsible user and contains many Orders and Tasks.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:13px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:11px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{fill:#0B0F2E;stroke-width:0.5}
</style>

<rect x="40" y="40" width="596" height="270" rx="20" stroke="#7F77DD"/>
<text class="th" x="338" y="72" text-anchor="middle">Account</text>
<text class="ts" x="338" y="90" text-anchor="middle">company or individual — the billing entity</text>

<rect x="56" y="120" width="150" height="100" rx="12" stroke="#3A8A5C"/>
<text class="th" x="131" y="150" text-anchor="middle" dominant-baseline="central">Customers</text>
<text class="ts" x="131" y="168" text-anchor="middle" dominant-baseline="central">1:n logins</text>

<rect x="223" y="120" width="150" height="100" rx="12" stroke="#2D5FDB"/>
<text class="th" x="298" y="150" text-anchor="middle" dominant-baseline="central">PMs</text>
<text class="ts" x="298" y="168" text-anchor="middle" dominant-baseline="central">assigned, m:n</text>

<line x1="373" y1="170" x2="388" y2="170" class="arr" marker-end="url(#arrow)"/>

<rect x="390" y="120" width="200" height="170" rx="12" stroke="#F0997B"/>
<text class="th" x="490" y="150" text-anchor="middle" dominant-baseline="central">Projects</text>
<text class="ts" x="490" y="168" text-anchor="middle" dominant-baseline="central">1 responsible user</text>

<rect x="410" y="190" width="160" height="80" rx="8" stroke="#EF9F27"/>
<text class="th" x="490" y="210" text-anchor="middle" dominant-baseline="central">Orders/Tasks</text>
<text class="ts" x="490" y="250" text-anchor="middle" dominant-baseline="central">many per project</text>
</svg>
