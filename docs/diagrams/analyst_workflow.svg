<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Analyst workflow</title>
<desc>An analyst is assigned a task, elixtempo tracks their time while they work, they submit for review, and if rejected the task loops back to them.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:13px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:11px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{fill:#0B0F2E;stroke-width:0.5;rx:8}
</style>

<rect x="20" y="100" width="150" height="56" stroke="#2D5FDB"/>
<text class="th" x="95" y="118" text-anchor="middle" dominant-baseline="central">Get assigned</text>
<text class="ts" x="95" y="136" text-anchor="middle" dominant-baseline="central">notified via messaging</text>

<line x1="170" y1="128" x2="208" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="100" width="150" height="56" stroke="#EF9F27"/>
<text class="th" x="285" y="118" text-anchor="middle" dominant-baseline="central">Work tracked</text>
<text class="ts" x="285" y="136" text-anchor="middle" dominant-baseline="central">elixtempo timer runs</text>

<line x1="360" y1="128" x2="398" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="400" y="100" width="150" height="56" stroke="#7F77DD"/>
<text class="th" x="475" y="118" text-anchor="middle" dominant-baseline="central">Submit for review</text>
<text class="ts" x="475" y="136" text-anchor="middle" dominant-baseline="central">hands off to reviewer</text>

<path d="M475 100 C 475 40, 285 40, 285 98" fill="none" stroke="#F0997B" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="46" text-anchor="middle">rejected — back to work</text>
</svg>
