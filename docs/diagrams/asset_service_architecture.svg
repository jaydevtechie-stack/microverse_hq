<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>asset-service architecture</title>
<desc>Frontend requests a presigned URL from asset-service, which checks ownership and, for downloads, checks task status with task-service, then mints the URL via MinIO. The actual file transfer happens directly between the frontend and MinIO, bypassing asset-service.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:13px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:11px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{fill:#0B0F2E;stroke-width:0.5;rx:8}
</style>

<rect x="40" y="40" width="170" height="56" stroke="#5F5E5A"/>
<text class="th" x="125" y="58" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="ts" x="125" y="76" text-anchor="middle" dominant-baseline="central">customer or PM browser</text>

<line x1="210" y1="68" x2="248" y2="68" class="arr" marker-end="url(#arrow)"/>

<rect x="250" y="40" width="200" height="56" stroke="#F0997B"/>
<text class="th" x="350" y="58" text-anchor="middle" dominant-baseline="central">asset-service</text>
<text class="ts" x="350" y="76" text-anchor="middle" dominant-baseline="central">checks role + ownership</text>

<line x1="450" y1="68" x2="478" y2="68" class="arr" marker-end="url(#arrow)"/>

<rect x="480" y="40" width="160" height="56" stroke="#3A8A5C"/>
<text class="th" x="560" y="58" text-anchor="middle" dominant-baseline="central">MinIO</text>
<text class="ts" x="560" y="76" text-anchor="middle" dominant-baseline="central">mints presigned URL</text>

<line x1="350" y1="96" x2="350" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="365" y="140">check status (downloads only)</text>

<rect x="250" y="180" width="200" height="56" stroke="#5F5E5A"/>
<text class="th" x="350" y="198" text-anchor="middle" dominant-baseline="central">task-service</text>
<text class="ts" x="350" y="216" text-anchor="middle" dominant-baseline="central">source of truth for status</text>

<path d="M125 96 L125 270 L560 270 L560 98" fill="none" stroke="#9BB8E0" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="285" text-anchor="middle">direct transfer — bypasses asset-service</text>
</svg>
