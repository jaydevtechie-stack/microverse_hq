<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Project manager workflow</title>
<desc>A PM claims an unassigned task matching their role, assigns it to an analyst, later owns the task once it reaches done, and can give kudos at any time.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:13px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:11px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{fill:#0B0F2E;stroke-width:0.5;rx:8}
</style>

<rect x="20" y="120" width="150" height="56" stroke="#5F5E5A"/>
<text class="th" x="95" y="138" text-anchor="middle" dominant-baseline="central">Claim task</text>
<text class="ts" x="95" y="156" text-anchor="middle" dominant-baseline="central">from role's pool</text>

<line x1="170" y1="148" x2="208" y2="148" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="120" width="150" height="56" stroke="#2D5FDB"/>
<text class="th" x="285" y="138" text-anchor="middle" dominant-baseline="central">Assign analyst</text>
<text class="ts" x="285" y="156" text-anchor="middle" dominant-baseline="central">task moves to analyst</text>

<line x1="360" y1="148" x2="398" y2="148" class="arr" marker-end="url(#arrow)"/>

<rect x="400" y="120" width="150" height="56" stroke="#3A8A5C"/>
<text class="th" x="475" y="138" text-anchor="middle" dominant-baseline="central">Owns "done"</text>
<text class="ts" x="475" y="156" text-anchor="middle" dominant-baseline="central">chases payment</text>

<line x1="475" y1="176" x2="475" y2="214" class="arr" marker-end="url(#arrow)"/>

<rect x="400" y="216" width="150" height="56" stroke="#EF9F27"/>
<text class="th" x="475" y="234" text-anchor="middle" dominant-baseline="central">Gives kudos</text>
<text class="ts" x="475" y="252" text-anchor="middle" dominant-baseline="central">optional, any time</text>
</svg>
