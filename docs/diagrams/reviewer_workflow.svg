<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Reviewer workflow</title>
<desc>A reviewer receives handed-off work, checks it, and either approves it forward to done or rejects it back to the analyst.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:13px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:11px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{fill:#0B0F2E;stroke-width:0.5;rx:8}
</style>

<rect x="20" y="100" width="150" height="56" stroke="#7F77DD"/>
<text class="th" x="95" y="118" text-anchor="middle" dominant-baseline="central">Receive work</text>
<text class="ts" x="95" y="136" text-anchor="middle" dominant-baseline="central">notified via messaging</text>

<line x1="170" y1="128" x2="208" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="100" width="150" height="56" stroke="#7F77DD"/>
<text class="th" x="285" y="118" text-anchor="middle" dominant-baseline="central">Check quality</text>
<text class="ts" x="285" y="136" text-anchor="middle" dominant-baseline="central">approve or reject</text>

<line x1="360" y1="115" x2="398" y2="115" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="379" y="102" text-anchor="middle">approve</text>

<rect x="400" y="87" width="150" height="44" stroke="#3A8A5C"/>
<text class="th" x="475" y="109" text-anchor="middle" dominant-baseline="central">Task → done</text>

<path d="M285 156 C 285 220, 95 220, 95 158" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="222" text-anchor="middle">reject — back to analyst</text>
</svg>
