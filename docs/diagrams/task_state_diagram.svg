<svg width="680" height="594" viewBox="0 0 680 594" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Task workflow state diagram</title>
<desc>A task moves from unassigned through analyst, reviewer, done, paid, to closed, with a backward path from reviewer back to analyst when work is rejected.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.th{fill:#E8F4FF;font-family:sans-serif;font-size:14px;font-weight:600}
.ts{fill:#9BB8E0;font-family:sans-serif;font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1}
rect{stroke-width:0.5;rx:8}
</style>

<rect x="190" y="40" width="300" height="44" fill="#0B0F2E" stroke="#5F5E5A"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">unassigned</text>
<text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">waiting in the pool</text>

<line x1="340" y1="84" x2="340" y2="132" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="134" width="300" height="44" fill="#0B0F2E" stroke="#2D5FDB"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">analyst</text>
<text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">single analyst assigned</text>

<line x1="340" y1="178" x2="340" y2="226" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="228" width="300" height="44" fill="#0B0F2E" stroke="#7F77DD"/>
<text class="th" x="340" y="244" text-anchor="middle" dominant-baseline="central">reviewer</text>
<text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">single reviewer checking</text>

<path d="M490 250 C 560 250, 560 156, 492 156" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="203">rejected</text>

<line x1="340" y1="272" x2="340" y2="320" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="322" width="300" height="44" fill="#0B0F2E" stroke="#3A8A5C"/>
<text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">done</text>
<text class="ts" x="340" y="354" text-anchor="middle" dominant-baseline="central">work approved, owner: PM</text>

<line x1="340" y1="366" x2="340" y2="414" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="416" width="300" height="44" fill="#0B0F2E" stroke="#EF9F27"/>
<text class="th" x="340" y="432" text-anchor="middle" dominant-baseline="central">paid</text>
<text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">download unlocked, owner: customer</text>

<line x1="340" y1="460" x2="340" y2="508" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="510" width="300" height="44" fill="#0B0F2E" stroke="#5F5E5A"/>
<text class="th" x="340" y="526" text-anchor="middle" dominant-baseline="central">closed</text>
<text class="ts" x="340" y="542" text-anchor="middle" dominant-baseline="central">task fully wrapped</text>
</svg>
