# Server Configuration
server.port=8080

# Spring-specific settings for file upload handling
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.springpix=DEBUG

# S3-compatible storage (MinIO locally; point at real AWS S3 in prod by
# clearing aws.s3.endpoint and supplying real AWS credentials)
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${S3_BUCKET_NAME:springpix}
aws.s3.endpoint=${S3_ENDPOINT:}
aws.region=${AWS_REGION:us-west-2}
