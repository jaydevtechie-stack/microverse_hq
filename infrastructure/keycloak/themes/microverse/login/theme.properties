# Microverse login theme.
# Inherits keycloak.v2 (PatternFly 5, native dark-mode support) entirely —
# we only layer brand colors/logo/background on top of its existing
# theming hooks (CSS custom properties), rather than re-implementing
# markup. See resources/css/microverse.css.
#
# "styles" is NOT additive with the parent's — declaring it here replaces
# keycloak.v2's own value rather than appending to it. keycloak.v2's own
# css/styles.css is where --keycloak-bg-logo-url/--keycloak-logo-url are
# actually *consumed* (.login-pf body background, .kc-logo-text image) —
# without listing it explicitly, our override file (if also named
# css/styles.css) would shadow it entirely and none of those rules would
# ever load. So: keep our file under a different name (microverse.css)
# and list the parent's styles.css first, ours last (so our variable
# values still win).
parent=keycloak.v2
import=common/keycloak

# branding/ is baked in at Docker build time (../../../Dockerfile COPYs
# the whole branding/mv-1.0/design-system tree in) — tokens.css here is
# the real canonical file, not a hand-vendored copy, and its own
# ./logos, ./images relative references resolve correctly because the
# copy preserves mv-1.0's actual folder layout.
#
# The token below in styles= (not real .properties syntax — a marker the
# Dockerfile's build step sed's out) gets replaced with the active
# theme's own css/light.css and .../dark.css under
# branding/design-system/themes/<id>/ (KEYCLOAK_BRAND_THEME /
# MICROVERSE_BRAND_THEME in the root .env), so Keycloak's login page
# picks up the same brand colors taskfusion does. Loaded after
# tokens.css (so its values win) and before microverse.css (which still
# owns logo/background-image — see that file's own comment on why those
# two need separate handling).
#
# Marker text (kept out of the prose above so the Dockerfile's literal
# find-and-replace doesn't also mangle this comment): two underscores,
# BRAND_THEME_CSS, two underscores.
styles=css/styles.css branding/design-system/tokens.css __BRAND_THEME_CSS__ css/microverse.css
