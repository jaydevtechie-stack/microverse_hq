# Microverse login theme.
# Inherits keycloak.v2 (PatternFly 5, native dark-mode support) entirely —
# we only layer brand colors/logo/background on top of its existing
# theming hooks (CSS custom properties), rather than re-implementing
# markup. See resources/css/microverse.css.
#
# "styles" is NOT additive with the parent's — declaring it here replaces
# keycloak.v2's own value rather than appending to it. keycloak.v2's own
# css/styles.css is where --keycloak-bg-logo-url/--keycloak-logo-url are
# actually *consumed* (.login-pf body background, .kc-logo-text image) —
# without listing it explicitly, our override file (if also named
# css/styles.css) would shadow it entirely and none of those rules would
# ever load. So: keep our file under a different name (microverse.css)
# and list the parent's styles.css first, ours last (so our variable
# values still win).
parent=keycloak.v2
import=common/keycloak

# branding/ is baked in at Docker build time (../../../Dockerfile COPYs
# tokens.css/logos/images in directly, plus branding/design-system/theme/
# — a fixed, theme-agnostic path the Dockerfile fills with whichever
# brand theme's css/{light,dark}.css was selected, rewriting
# [data-brand-theme="<id>"] to bare :root along the way since this file
# has no idea which theme that was, or that Vienna/Uhuru even exist).
# tokens.css's own ./logos, ./images relative references resolve
# correctly because the copy preserves mv-1.0's actual folder layout.
#
# branding/design-system/theme/{light,dark}.css loads after tokens.css
# (so its color values win) and before microverse.css (which still owns
# logo/background-image — see that file's own comment on why those two
# need separate handling).
styles=css/styles.css branding/design-system/tokens.css branding/design-system/theme/light.css branding/design-system/theme/dark.css css/microverse.css
