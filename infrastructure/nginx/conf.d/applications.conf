server {

    listen 80;

    server_name microverse.local gofeeler.microverse.local springpix.microverse.local pyreel.microverse.local djaboard.microverse.local elixtempo.microverse.local rustledger.microverse.local rubykudos.microverse.local;

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    # One entry per domain-service microsite (see data/services.js's
    # SERVICE_THEME) — all proxy to the same taskfusion app below,
    # which decides what to render per-hostname.
    server_name microverse.local gofeeler.microverse.local springpix.microverse.local pyreel.microverse.local djaboard.microverse.local elixtempo.microverse.local rustledger.microverse.local rubykudos.microverse.local;

    ssl_certificate /etc/nginx/certs/microverse.local.crt;
    ssl_certificate_key /etc/nginx/certs/microverse.local.key;

    # same app on both hosts — it decides what "/" means per-hostname
    # (anonymous landing page / authenticated dashboard / gofeeler task
    # list), see applications/taskfusion/src/App.js
    location / {

        proxy_pass http://microverse-taskfusion:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

    }

    # One file per service under services/ (task-service.conf,
    # search-service.conf, asset-service.conf, ...) rather than growing
    # this file's location blocks indefinitely as more services get an
    # /api/* route — see services/task-service.conf's header comment
    # for why these are `include`d here rather than being their own
    # top-level conf.d/*.conf files.
    include /etc/nginx/conf.d/services/*.conf;

}
