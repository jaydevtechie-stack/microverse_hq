server {

    listen 80;

    server_name microverse.local gofeeler.microverse.local;

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    server_name microverse.local gofeeler.microverse.local;

    ssl_certificate /etc/nginx/certs/microverse.local.crt;
    ssl_certificate_key /etc/nginx/certs/microverse.local.key;

    # same app on both hosts — it decides what "/" means per-hostname
    # (anonymous landing page / authenticated dashboard / gofeeler task
    # list), see applications/taskfusion/src/App.js
    location / {

        proxy_pass http://microverse-taskfusion:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

    }

    # task-service isn't published on its own host — the browser reaches
    # it through this same origin, avoiding a second TLS cert/CORS setup
    location /api/tasks {

        proxy_pass http://microverse-task-service:3000/api/tasks;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # same reasoning as /api/tasks — search-service stays internal-only
    location /api/tags {

        proxy_pass http://microverse-search-service:8000/tags;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # same reasoning as /api/tasks — asset-service stays internal-only.
    # Only mints presigned URLs here (small JSON bodies) — the actual
    # file bytes go straight to storage.microverse.local, see assets.conf
    location /api/assets {

        proxy_pass http://microverse-asset-service:8080/assets;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
