# Content-type allowlist for direct-to-MinIO uploads (PUT requests to
# storage.microverse.local — see below). GoFeeler-shaped for now (text
# exports, the odd PDF/image attachment); broaden as other domain
# services start uploading through the same shared bucket.
map $http_content_type $asset_content_type_ok {
    default 0;
    "~*^text/" 1;
    "~*^image/" 1;
    "application/json" 1;
    "application/pdf" 1;
}

# nginx's `if` can't nest, so the two conditions (PUT method, bad
# content-type) get combined into one map lookup instead of two if
# blocks — only reject when it's a PUT AND the type isn't allowed; GET
# (download) and everything else always pass through.
map "$request_method:$asset_content_type_ok" $asset_reject_upload {
    default 0;
    "PUT:0" 1;
}

server {

    listen 80;

    server_name storage.microverse.local;

    return 301 https://$host$request_uri;

}

# MinIO gets its own clean subdomain rather than a path prefix on the
# main application server block — S3 SigV4 presigned URLs and a
# path-prefixed reverse proxy don't mix (AWS SDK's canonical-request
# signing doesn't account for a stripped prefix, so verification fails
# no matter how the prefix-stripping is done). A dedicated host with a
# plain root "/" proxy sidesteps the whole problem — same pattern as
# sso.microverse.local.
server {

    listen 443 ssl;

    server_name storage.microverse.local;

    ssl_certificate /etc/nginx/certs/microverse.local.crt;
    ssl_certificate_key /etc/nginx/certs/microverse.local.key;

    # nginx's own default (1m) is too small for real uploads; MinIO's
    # own object size limit is far higher than this needs to be for now
    client_max_body_size 50m;

    location / {

        if ($asset_reject_upload) {
            return 415;
        }

        proxy_pass http://microverse-minio:9000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads go straight to MinIO from the browser — without CORS
        # headers here, a same-origin-looking fetch() from a microsite
        # (gofeeler.microverse.local) calling this different host would
        # get blocked
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = OPTIONS) {
            return 204;
        }

    }

}
