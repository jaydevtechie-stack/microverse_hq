# Listmonk's own admin UI — own clean subdomain rather than a path
# prefix, same pattern as sso.microverse.local (keycloak.conf) and
# mailhog.microverse.local (mailhog.conf). Unlike MailHog, Listmonk has
# its own login (LISTMONK_ADMIN_USER/PASSWORD, see docker-compose.yml),
# so this is dev-tooling behind real auth, not a wide-open host — see
# infrastructure/secrets/README.md for the three-place addition (cert
# SAN, hosts file, this file) every new subdomain needs.
#
# No WebSocket upgrade headers (unlike mailhog.conf) — the Listmonk UI
# polls over plain HTTP/XHR, it doesn't open one.

server {

    listen 80;

    server_name listmonk.microverse.local;

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    server_name listmonk.microverse.local;

    ssl_certificate /etc/nginx/certs/microverse.local.crt;
    ssl_certificate_key /etc/nginx/certs/microverse.local.key;

    location / {

        proxy_pass http://microverse-listmonk:9000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
