# Dev-only mail catcher UI — own clean subdomain rather than a path
# prefix, same pattern as sso.microverse.local (keycloak.conf). MailHog
# has no authentication of its own (see infrastructure/secrets/README.md
# for the three-place addition — cert SAN, hosts file, this file — every
# new subdomain needs), so this is reachable by anyone who can resolve
# the hostname, same as every other *.microverse.local dev host.
#
# Unlike notification-service.conf's WS proxy (a dedicated /socket.io/
# location, separate from its REST paths), MailHog's own UI, assets, and
# WebSocket all live under the same "/" — so the Connection header has
# to stay conditional (nginx's documented WebSocket-proxying pattern)
# rather than hardcoded to "upgrade", or every plain page/asset request
# would carry that header too.
map $http_upgrade $mailhog_connection_upgrade {
    default upgrade;
    ''      close;
}

server {

    listen 80;

    server_name mailhog.microverse.local;

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    server_name mailhog.microverse.local;

    ssl_certificate /etc/nginx/certs/microverse.local.crt;
    ssl_certificate_key /etc/nginx/certs/microverse.local.key;

    location / {

        proxy_pass http://microverse-mailhog:8025;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MailHog's UI opens a WebSocket (api/v2/websocket) for live
        # inbox updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mailhog_connection_upgrade;

    }

}
