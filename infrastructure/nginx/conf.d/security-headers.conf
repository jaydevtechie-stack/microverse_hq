# Dropped straight into the http {} block (nginx:alpine's default
# nginx.conf globs conf.d/*.conf, not just server{} files) so every
# server block in this directory picks these up without repeating them.
# add_header/ssl_protocols/ssl_ciphers are valid at http scope; none of
# the other conf.d files define their own add_header, so nothing here
# gets silently overridden by nginx's per-context add_header reset.
#
# CSP deliberately not included yet — the one header here actually
# capable of breaking the app (CRA inline styles, Keycloak redirects,
# MinIO direct uploads), and it needs a real browser pass against the
# full stack to get the allowlist right rather than a guess. See
# docs/security.md item 3.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
