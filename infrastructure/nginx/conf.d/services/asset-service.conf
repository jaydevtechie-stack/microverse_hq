# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# asset-service stays internal-only, same reasoning as task-service.
# Only mints presigned URLs here (small JSON bodies) — the actual file
# bytes go straight to storage.microverse.local, see assets.conf.

location /api/assets {

    proxy_pass http://microverse-asset-service:8080/assets;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
