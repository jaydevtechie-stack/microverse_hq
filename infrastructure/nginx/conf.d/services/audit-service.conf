# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# audit-service stays internal-only, same reasoning as
# task-service/search-service/notification-service. Backend-only proof of
# concept (Branch 8) — nothing in the frontend calls this yet.

location /api/audit {

    proxy_pass http://microverse-audit-service:4002/audit;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
