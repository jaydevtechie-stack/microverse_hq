# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# Covers both the bill CRUD routes and the Stripe webhook path (mounted
# under the same /billing prefix in billing-service itself) — one location
# block for the whole service, same as audit-service's.

location /api/billing {

    proxy_pass http://microverse-billing-service:4003/billing;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
