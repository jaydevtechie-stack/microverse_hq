# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# GET /api/blog/posts and GET /api/blog/posts/:slug are reachable
# without a session — blog-service decides published-only vs. everything
# from the caller's (optional) claims itself, same "one path, scoped
# server-side" posture as rustledger's /api/billing/bills. No nginx-level
# gating: every private route here relies on blog-service's own
# platform:marketing/platform:admin check, same as every other service
# in this stack. Blog images are served by asset-service instead (see
# assets.conf) — this file only covers post content/metadata.

location /api/blog {

    proxy_pass http://microverse-blog-service:4003/blog;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
