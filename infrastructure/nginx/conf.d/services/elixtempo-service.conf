# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# ElixTempo has never been browser-reachable before (Phase 5) — every
# prior verification called it container-to-container. Two prefixes,
# not one, since /api/sessions and /api/analysts/:id/hours don't share
# a common path segment.

location /api/sessions {

    proxy_pass http://microverse-elixtempo:4000/api/sessions;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}

location /api/analysts {

    proxy_pass http://microverse-elixtempo:4000/api/analysts;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
