# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# gofeeler stays internal-only, same reasoning as task-service/
# search-service. Branch 5's LLM sentiment engine (/analyze, /templates)
# had no route here at all until now — the Go service was reachable
# only from other containers on microverse-network, never from the
# browser.

location /api/gofeeler/analyze {

    proxy_pass http://microverse-gofeeler:8082/analyze;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}

location /api/gofeeler/templates {

    proxy_pass http://microverse-gofeeler:8082/templates;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
