# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# notification-service stays internal-only, same reasoning as
# task-service/search-service.

location /api/notifications {

    proxy_pass http://microverse-notification-service:4001/notifications;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}

# First WebSocket upgrade in this stack — Socket.IO's handshake needs
# Upgrade/Connection passed through explicitly; none of the REST-only
# proxy blocks elsewhere in conf.d/ have needed this.
location /socket.io/ {

    proxy_pass http://microverse-notification-service:4001/socket.io/;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
