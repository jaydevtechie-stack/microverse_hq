# Proxied into applications.conf's server block via `include` — see
# task-service.conf's header comment for why this can't be a top-level
# conf.d/*.conf file on its own.
#
# rustledger owns Stripe collection directly (Branch 9) — an earlier
# iteration proxied /api/billing to a separate Node billing-service in
# front of rustledger; that service is gone, rustledger's own Axum routes
# now live under /api/billing/... to match this location unchanged, so
# the frontend needed no changes when the backend moved. Covers both the
# bill CRUD routes and the Stripe webhook path.

location /api/billing {

    proxy_pass http://microverse-rustledger:8080/api/billing;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}
