# Proxied into applications.conf's server block via `include` — not
# included at the top level (nginx.conf only globs conf.d/*.conf, not
# subdirectories), since a bare `location` block needs a surrounding
# `server {}` to be valid on its own.
#
# task-service isn't published on its own host — the browser reaches it
# through this same origin, avoiding a second TLS cert/CORS setup.

location /api/tasks {

    proxy_pass http://microverse-task-service:3000/api/tasks;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

}

