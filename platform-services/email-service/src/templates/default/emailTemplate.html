<!-- default/emailTemplate.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="background-color: #f4f4f4; font-family: Arial, sans-serif;">
  <h2>{{subject}}</h2>
  <p>Hi {{userName}},</p>
  <p>{{message}}</p>
  <p>Best regards,<br> The {{brandName}} Team</p>
</body>
</html>
