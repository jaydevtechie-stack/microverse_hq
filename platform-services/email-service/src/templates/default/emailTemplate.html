<!-- default/emailTemplate.html
     Adapted from branding/mv-1.0/design-system/mock-ups/default-email-template.html.
     That mock-up shows a specific scenario (task assignment, with a status
     badge, project/due-date/assignee info grid, and a "View task" CTA) —
     this template only has {{subject}}, {{userName}}, {{message}},
     {{brandName}} to work with (see routes/email.js and
     notification-service/events/kafka-consumer.js's messageFor, which
     builds one plain-text sentence for every notification type). Keeps
     the mock's brand chrome, fonts, and Outlook/table-based email-client
     safety; drops the parts that need data this template never receives
     rather than shipping empty boxes or a dead CTA link. -->
<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>

<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style>
  table, td { font-family: Arial, sans-serif; }
</style>
<![endif]-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  body, table, td, p, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
  img { -ms-interpolation-mode:bicubic; border:0; height:auto; line-height:100%; outline:none; text-decoration:none; }
  body { margin:0; padding:0; width:100% !important; height:100% !important; }
  table { border-collapse:collapse !important; }

  @media only screen and (max-width:600px) {
    .email-container { width:100% !important; max-width:100% !important; }
    .card-padding { padding:28px 22px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F5F7FA;">

<!-- preheader: shows in inbox preview, hidden in body -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F5F7FA;">
  {{message}}
  &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F7FA;">
<tr>
<td align="center" style="padding:40px 16px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="email-container" style="width:600px;max-width:600px;">

    <!-- Brand -->
    <tr>
      <td style="padding:0 4px 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td width="26" height="26" style="width:26px;height:26px;background-color:#2B5FD9;border-radius:8px;font-size:1px;line-height:1px;">&nbsp;</td>
            <td style="padding-left:10px;font-family:Manrope,Arial,sans-serif;font-size:16px;font-weight:800;color:#0E1621;">{{brandName}}</td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Main card -->
    <tr>
      <td style="background-color:#FFFFFF;border:1px solid #DCE3EA;border-radius:16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="card-padding" style="padding:40px;">

            <p style="margin:0 0 18px;font-family:Manrope,Arial,sans-serif;font-size:14px;color:#67707A;">
              Hi {{userName}},
            </p>

            <h1 style="margin:0 0 28px;font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:#0E1621;line-height:1.4;">
              {{message}}
            </h1>

            <p style="margin:0;font-family:Manrope,Arial,sans-serif;font-size:14px;line-height:1.65;color:#67707A;">
              Best regards,<br>The {{brandName}} Team
            </p>

          </td>
        </tr>
        </table>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding:28px 12px 0;" align="center">
        <p style="margin:0;font-family:Manrope,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9AA7B2;">
          You're receiving this because you're a member of {{brandName}}.
        </p>
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
